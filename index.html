<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Dev Magazine</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Navbar & Progress Bar -->
    <nav class="navbar">
      <div class="nav-content">
        <div class="logo">MD.Mag</div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <i class="fas fa-sun"></i>
        </button>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </nav>

    <main>
      <!-- EXPLORE SECTION -->
      <section id="explore-view" class="explore-section glass-card">
        <div class="explore-header">
          <h2>Explore Magazines</h2>
          <p>Discover articles and publications from any area of interest.</p>
        </div>
        
        <div class="search-container">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="topic-search" placeholder="Search topics (e.g., Technology, Art, Health)..." />
            <button id="search-btn">Search</button>
          </div>
          
          <div class="category-pills">
            <button class="pill active" data-category="trending">Trending</button>
            <button class="pill" data-category="technology">Technology</button>
            <button class="pill" data-category="design">Design</button>
            <button class="pill" data-category="business">Business</button>
            <button class="pill" data-category="health">Health</button>
            <button class="pill" data-category="science">Science</button>
          </div>
        </div>

        <div class="magazine-grid" id="magazine-results">
          <!-- Dynamic results will be injected here -->
        </div>
      </section>

      <!-- ARTICLE VIEW -->
      <div id="article-view" class="hidden">
        <section class="heading glass-card">
          <header class="hero">
            <div class="hero-image-container">
               <img id="article-hero-img" src="" alt="Hero image" loading="lazy" class="hero-img" />
               <div class="hero-overlay"></div>
            </div>
            <div class="hero-text">
              <span id="article-tag" class="category-tag">Tag</span>
              <h1 id="article-title" class="hero-title">Title</h1>
              <p id="article-subtitle" class="hero-subtitle">Subtitle</p>
            </div>
          </header>

          <div class="meta-info">
            <div class="author">
              <img src="https://upload.wikimedia.org/wikipedia/commons/6/63/Wikipedia-logo.png" alt="Wikipedia" class="author-avatar" style="background:white; padding:2px;">
              <div class="author-details">
                <p class="author-name">By <a href="#" id="article-source" target="_blank" rel="noreferrer">Wikipedia Contributors</a></p>
                <p class="publish-date" id="article-date">Updated Recently</p>
              </div>
            </div>
            
            <div class="social-icons">
              <a href="#" class="social-btn facebook"><i class="fab fa-facebook-f"></i></a>
              <a href="#" class="social-btn twitter"><i class="fab fa-twitter"></i></a>
              <a href="#" class="social-btn linkedin"><i class="fab fa-linkedin-in"></i></a>
              <button id="close-article-btn" class="social-btn bookmark" title="Back to Search" style="background: var(--accent-color); color: white;"><i class="fas fa-times"></i></button>
            </div>
          </div>
        </section>

        <div class="content-wrapper">
          <section class="text" id="article-body">
            <!-- Paragraphs injected here -->
          </section>

          <section class="text-with-images">
            <article class="brief-history glass-card">
              <div class="history-header">
                <h3 class="list-title">Table of Contents</h3>
                <p class="list-subtitle">Article Overview</p>
              </div>
              <ul class="timeline" id="article-toc">
                <!-- injected subheadings -->
              </ul>
            </article>

            <aside class="image-gallery">
              <figure class="gallery-item glass-card tilt-effect">
                <img id="gallery-img-1" src="" alt="Gallery Image 1" loading="lazy" />
                <figcaption>Related imagery</figcaption>
              </figure>
              <figure class="gallery-item glass-card tilt-effect">
                <img id="gallery-img-2" src="" alt="Gallery Image 2" loading="lazy" />
                <figcaption>Visual context</figcaption>
              </figure>
              <div class="gallery-quote glass-panel">
                <p id="article-quote">"Empowering millions to learn through building."</p>
              </div>
            </aside>
          </section>
        </div>
      </div>
    </main>

    <button id="back-to-top" class="back-to-top" aria-label="Back to top">
      <i class="fas fa-arrow-up"></i>
    </button>

    <script src="script.js"></script>
  </body>
</html>
